<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura Music</title>
    <meta name="description" content="AI-powered music discovery with Spotify" />
    <meta name="author" content="Aura" />

    <!-- PWA / App meta -->
    <meta name="application-name" content="Aura Music" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Splash screen color for iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aura Music" />
    <meta property="og:description" content="AI-powered music discovery with Spotify" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura Music" />
    <meta name="twitter:description" content="AI-powered music discovery with Spotify" />
    <meta name="twitter:image" content="/icons/icon-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Define a safe no-op handler so the Spotify SDK doesn't throw
      // if it loads before our React app sets window.onSpotifyWebPlaybackSDKReady.
      window.onSpotifyWebPlaybackSDKReady = window.onSpotifyWebPlaybackSDKReady || function () {};
    </script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
